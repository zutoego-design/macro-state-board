[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macroboard"
version = "0.2.0"
description = "Bottom-up macro data platform: point-in-time store, composite indicators, and a dashboard."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
macroboard = "macroboard.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
